# Every push, on every branch, becomes the production deployment.
#
# Vercel's Git integration can only promote ONE branch to production, and for
# this project that branch is `main`. It keeps that job: `main` deploys to
# production natively, with no credentials needed here.
#
# This workflow covers the rest — a push to ANY OTHER branch is built and
# promoted to production via the Vercel CLI. `branches-ignore: [main]` is what
# keeps the two paths off each other; without it, a push to main would build
# twice and the two production deploys would race.
#
# Deliberate consequence: if the secrets below are missing, non-main branches
# silently don't deploy, but main still does. An earlier version disabled
# Vercel's integration outright and took the whole site's deploys down with it
# when the secrets weren't set yet.
name: Deploy to Vercel Production

on:
  push:
    branches-ignore: ['main']
  workflow_dispatch:

# One production deploy at a time; a newer push cancels an in-flight older one,
# so the live site converges on the most recent commit rather than whichever
# build happened to finish last.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Pulls the project's production environment variables (SITE_URL et al.)
      # so the build here matches a build run on Vercel's own infrastructure.
      - name: Pull Vercel production environment
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
